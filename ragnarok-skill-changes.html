<body class="skill-changes-page">
  <a class="skip-link" href="#main">跳至主要內容</a>
  <header class="skill-page-header"><a id="skill-home-link" href="./index.html">← 返回工具箱</a><span class="muted">SakeTora Space / 仙境傳說</span></header>
  <main id="main">
    <div class="skill-page-heading"><span class="eyebrow muted">RAGNAROK ONLINE / SKILL HISTORY</span><h1>技能調整記錄</h1></div>
    <p id="skill-data-notice" class="skill-data-notice" hidden></p>
    <section id="skill-changes-tool" aria-label="技能調整查詢">
      <div class="skill-filters">
        <label class="field" for="skill-job">職業<select id="skill-job"><option value="">所有職業</option></select></label>
        <label class="field" for="skill-query">搜尋技能<input id="skill-query" type="search" placeholder="中文、韓文、英文、日文名稱或技能 ID"></label>
        <label class="field" for="skill-version">版本<select id="skill-version"><option value="">所有版本</option></select></label>
        <button id="skill-reset" class="secondary-button" type="button">重設篩選</button>
        <button id="skill-copy-filters" class="secondary-button" type="button" aria-label="複製篩選連結" title="複製篩選連結">🔗</button>
      </div>
      <span id="skill-copy-status" class="skill-copy-status" role="status" aria-live="polite"></span>
      <div class="skill-browser">
        <aside class="skill-picker" aria-labelledby="skill-picker-heading">
          <h2 id="skill-picker-heading">篩選結果 <span id="skill-count" class="muted"></span></h2>
          <button id="skill-show-all" class="secondary-button" type="button" aria-pressed="true" aria-controls="skill-results">查看全部符合技能</button>
          <div id="skill-list" class="skill-list"></div>
        </aside>
        <section class="skill-history" aria-label="技能調整記錄">
          <p id="skill-result-status" class="muted" role="status" aria-live="polite" hidden></p>
          <div id="skill-results" tabindex="-1"></div>
        </section>
      </div>
      <section class="skill-announcements" aria-labelledby="skill-announcements-heading">
        <h2 id="skill-announcements-heading">各版本官方公告</h2>
        <p class="muted">列出維護公告與預定調整的開發者筆記，依版本篩選顯示。</p>
        <div id="skill-announcement-list"></div>
      </section>
    </section>
    <noscript><p class="notice">請啟用 JavaScript 以使用技能調整查詢。</p></noscript>
    <footer><span>仙境傳說 Ragnarok Online © GRAVITY CO., Ltd.</span><button id="back-to-top" class="secondary-button" type="button">返回頂端</button></footer>
  </main>
