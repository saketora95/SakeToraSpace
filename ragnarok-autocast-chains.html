      <h1>連鎖自動詠唱裝備</h1>
      <p>此頁面整理具有「施展技能 A 時，有機率自動連鎖施展技能 B」功能的相關裝備。</p>
      <p class="chain-source">資料為人工整理，可能包含疏漏，實際效果以遊戲內說明為主。</p>
    </div>
    <section id="chain-tool" aria-label="連鎖自動詠唱裝備查詢">

        <label class="field" for="chain-job">職業<select id="chain-job"><option value="">所有職業</option></select></label>

        <label class="field" for="chain-server">twRO 實裝<select id="chain-server"><option value="">全部</option><option value="released">已實裝</option><option value="pending">尚未實裝</option></select></label>
        <button id="chain-reset" class="secondary-button" type="button">重設篩選</button>
      </div>
      <p id="chain-status" class="chain-status" role="status" aria-live="polite"></p>
      <div id="chain-results"></div>
